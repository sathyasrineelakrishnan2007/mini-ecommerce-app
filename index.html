
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>ShopEase</h1>
        <button id="cartButton">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <section class="hero">
        <h2>Discover Your Favorites</h2>
        <p>Great products. Simple shopping.</p>
    </section>

    <main class="container">
        <h2>Our Products</h2>
        <div id="productList" class="product-grid"></div>

        <section id="cartSection" class="cart-section">
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button id="checkoutButton" class="checkout-btn">
                Proceed to Checkout
            </button>
        </section>
    </main>

    <div id="checkoutModal" class="modal" role="dialog"
         aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="modal-content">
            <button id="closeModal" class="close-btn"
                    aria-label="Close checkout">&times;</button>
            <h2 id="modalTitle">Checkout Preview</h2>
            <p id="checkoutSummary"></p>
            <p>This is a demo checkout. No real payment will be made.</p>
            <button id="confirmButton" class="checkout-btn">
                Confirm Demo Order
            </button>
        </div>
    </div>

    <footer>
        <p>© 2026 ShopEase | Mini E-Commerce Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
